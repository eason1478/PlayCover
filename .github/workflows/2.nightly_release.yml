name: Build nightly release
on:
  workflow_dispatch:
    inputs:
      release_name:
        description: 'Release name (optional)'
        required: false
        default: 'Nightly'
  schedule:
    - cron: "30 19 * * *"
permissions:
  contents: write
env:
  CI: true
jobs:
  build:
    runs-on: macos-26
    env:
      GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        shell: bash
        run: |
          brew install graphicsmagick imagemagick swiftlint create-dmg
          gem install fastlane
          bundle install
          pip install setuptools

      - name: Set build number
        shell: bash
        run: |
          fastlane run increment_build_number build_number:${{ github.run_number }}

      - name: Fastlane Nightly
        shell: bash
        run: fastlane nightly
        env:
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120

      - name: Create DMG
        shell: bash
        run: |
          create-dmg ./output/PlayCover.app ./output
          mv ./output/*.dmg ./output/PlayCover_nightly_${{ github.run_number }}.dmg

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlayCover_nightly_${{ github.run_number }}.dmg
          path: output/PlayCover_nightly_${{ github.run_number }}.dmg
